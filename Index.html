
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Misha AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px; min-height: 100vh;
      background: #070b19; color: #f4f7ff;
      font-family: Arial, sans-serif; text-align: center;
    }
    h1 { margin-top: 35px; color: #57d9ff; letter-spacing: 5px; }
    .subtitle { color: #aab7d0; }
    .orb {
      width: 190px; height: 190px; margin: 30px auto;
      border-radius: 50%;
      background: radial-gradient(circle, #e6ffff, #43d7ff 20%, #3874ff 55%, #161b75 80%);
      box-shadow: 0 0 45px #26cfff88;
    }
    #status { color: #69ddff; margin: 20px; }
    #chat {
      height: 320px; overflow-y: auto; padding: 16px;
      background: #11182a; border: 1px solid #293753;
      border-radius: 18px; text-align: left;
      white-space: pre-wrap; overflow-wrap: anywhere;
      line-height: 1.6; margin-bottom: 15px;
    }
    textarea {
      width: 100%; min-height: 85px; padding: 14px;
      border-radius: 14px; background: #11182a;
      border: 1px solid #354666; color: white; font-size: 16px;
    }
    button {
      padding: 12px 18px; margin: 8px 3px;
      border: 0; border-radius: 24px;
      background: #42d6ff; color: #07111f;
      font-size: 16px; font-weight: bold;
    }
    .secondary { background: #25344e; color: white; }
    .footer { margin-top: 25px; color: #7e8ba5; font-size: 13px; }
  </style>
</head>
<body>
  <h1>MISHA AI</h1>
  <p class="subtitle">Your personal AI assistant</p>
  <div class="orb"></div>
  <div id="status">Ready to help</div>
  <div id="chat">Misha: Hello! I'm Misha, your AI assistant. Ask me anything.</div>
  <textarea id="msg" placeholder="Ask Misha a question..."></textarea>
  <div>
    <button id="sendBtn">Send</button>
    <button id="voiceBtn" class="secondary">🎤 Voice Input</button>
  </div>
  <div class="footer">Developed by Athmanathan Venkateswaran</div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("msg");
    const statusBox = document.getElementById("status");
    const sendBtn = document.getElementById("sendBtn");
    const voiceBtn = document.getElementById("voiceBtn");
    let busy = false;

    async function send() {
      const message = input.value.trim();
      if (!message || busy) return;

      busy = true;
      sendBtn.disabled = true;
      statusBox.textContent = "Connecting to Misha AI...";
      chat.textContent += "\n\nYou: " + message + "\n\nMisha: Thinking...";
      input.value = "";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const raw = await response.text();
        let data;
        try {
          data = JSON.parse(raw);
        } catch {
          throw new Error("Server returned an invalid response (HTTP " + response.status + ").");
        }

        if (!response.ok || data.error) {
          throw new Error(data.error || "AI request failed.");
        }

        chat.textContent = chat.textContent.replace(
          "Misha: Thinking...", "Misha: " + data.reply
        );
        statusBox.textContent = "AI connected";

        if ("speechSynthesis" in window && data.reply) {
          speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(data.reply);
          utterance.lang = "en-IN";
          speechSynthesis.speak(utterance);
        }
      } catch (error) {
        chat.textContent = chat.textContent.replace(
          "Misha: Thinking...", "Misha: " + error.message
        );
        statusBox.textContent = "Connection error";
      } finally {
        busy = false;
        sendBtn.disabled = false;
        chat.scrollTop = chat.scrollHeight;
      }
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send();
      }
    });

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (Recognition) {
      const recognition = new Recognition();
      recognition.lang = "en-IN";
      recognition.continuous = false;
      recognition.onstart = () => statusBox.textContent = "Listening...";
      recognition.onresult = event => {
        input.value = event.results[0][0].transcript;
        send();
      };
      recognition.onerror = event =>
        statusBox.textContent = "Voice error: " + event.error;
      voiceBtn.addEventListener("click", () => {
        try { recognition.start(); }
        catch { statusBox.textContent = "Please try voice input again."; }
      });
    } else {
      voiceBtn.addEventListener("click", () =>
        alert("Voice input is not supported in this browser. You can type instead.")
      );
    }
  </script>
</body>
</html>
